name: Deploy
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Clean up Node files
        run: |
          echo '<meta http-equiv="refresh" content="0; url=latest.html">' > index.html
          rm -rf node_modules .git package.json package-lock.json index.js
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy . --project-name=fx-client-test --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
